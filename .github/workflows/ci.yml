name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProcessCoreOptimizer.slnx

      - name: Build Release
        run: dotnet build ProcessCoreOptimizer.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test ProcessCoreOptimizer.Tests/ProcessCoreOptimizer.Tests.csproj -c Release --no-build --nologo

      - name: Diff check
        run: git diff --check
